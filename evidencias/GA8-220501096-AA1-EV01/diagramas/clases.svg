<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de clases del modulo de agendamiento: Cita se asocia con Cliente, Barbero y Servicio por id; CitaDAO opera sobre Cita sin ninguna validacion de cruce de horario. Cita.fecha y Cita.hora son texto plano (String), y Servicio.precio y duracionMinutos son enteros (int).">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="none" stroke="currentColor" stroke-width="1.4"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: currentColor; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.6; }
    .sep { stroke: currentColor; stroke-width: 1; }
    .cname { font-size: 14px; font-weight: 700; }
    .field { font-size: 11.5px; }
    .assoc { stroke: currentColor; stroke-width: 1.4; fill: none; }
    .lbl { font-size: 11px; }
    .note { font-size: 11px; font-style: italic; }
  </style>

  <text x="500" y="26" text-anchor="middle" class="cname" font-size="16">Diagrama de clases - modulo de agendamiento (model + CitaDAO)</text>

  <!-- Cita -->
  <rect class="box" x="370" y="230" width="260" height="190"/>
  <text x="500" y="250" text-anchor="middle" class="cname">Cita</text>
  <line x1="370" y1="260" x2="630" y2="260" class="sep"/>
  <text x="382" y="278" class="field">- id: int</text>
  <text x="382" y="294" class="field">- clienteId, barberoId, servicioId: int</text>
  <text x="382" y="310" class="field">- fecha: String</text>
  <text x="382" y="326" class="field">- hora: String</text>
  <text x="382" y="342" class="field">- clienteNombre, barberoNombre,</text>
  <text x="382" y="356" class="field">  servicioNombre: String</text>
  <text x="382" y="372" class="field">- servicioPrecio: int</text>
  <text x="382" y="388" class="field">- servicioDuracion: int</text>
  <text x="382" y="406" class="field">+ getters / setters</text>

  <!-- Cliente -->
  <rect class="box" x="60" y="60" width="200" height="90"/>
  <text x="160" y="80" text-anchor="middle" class="cname">Cliente</text>
  <line x1="60" y1="90" x2="260" y2="90" class="sep"/>
  <text x="72" y="108" class="field">- id: int</text>
  <text x="72" y="124" class="field">- nombre: String</text>

  <!-- Barbero -->
  <rect class="box" x="740" y="60" width="200" height="90"/>
  <text x="840" y="80" text-anchor="middle" class="cname">Barbero</text>
  <line x1="740" y1="90" x2="940" y2="90" class="sep"/>
  <text x="752" y="108" class="field">- id: int</text>
  <text x="752" y="124" class="field">- nombre: String</text>

  <!-- Servicio -->
  <rect class="box" x="400" y="500" width="200" height="120"/>
  <text x="500" y="520" text-anchor="middle" class="cname">Servicio</text>
  <line x1="400" y1="530" x2="600" y2="530" class="sep"/>
  <text x="412" y="548" class="field">- id: int</text>
  <text x="412" y="564" class="field">- nombre, clave: String</text>
  <text x="412" y="580" class="field">- precio: int</text>
  <text x="412" y="596" class="field">- duracionMinutos: int</text>

  <!-- associations -->
  <line x1="260" y1="120" x2="400" y2="260" class="assoc" marker-end="url(#arrow2)"/>
  <text x="270" y="190" class="lbl">1 clienteId</text>
  <line x1="740" y1="120" x2="600" y2="260" class="assoc" marker-end="url(#arrow2)"/>
  <text x="680" y="190" class="lbl">barberoId 1</text>
  <line x1="500" y1="420" x2="500" y2="500" class="assoc" marker-end="url(#arrow2)"/>
  <text x="508" y="465" class="lbl">servicioId 1</text>

  <!-- CitaDAO -->
  <rect class="box" x="50" y="470" width="260" height="150"/>
  <text x="180" y="490" text-anchor="middle" class="cname">CitaDAO</text>
  <line x1="50" y1="500" x2="310" y2="500" class="sep"/>
  <text x="62" y="518" class="field">+ insertar(Cita): int</text>
  <text x="62" y="534" class="field">+ listarTodas(): List&lt;Cita&gt;</text>
  <text x="62" y="550" class="field">+ buscarPorId(int): Cita</text>
  <text x="62" y="566" class="field">+ actualizar(Cita): void</text>
  <text x="62" y="582" class="field">+ eliminar(int): void</text>
  <text x="62" y="606" class="note">sin validacion de cruce</text>

  <line x1="310" y1="545" x2="370" y2="350" class="assoc" marker-end="url(#arrow2)"/>
  <text x="300" y="440" class="lbl">opera sobre</text>

  <!-- note box -->
  <rect x="640" y="440" width="320" height="110" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="656" y="462" class="note">Hallazgo confirmado en el codigo fuente:</text>
  <text x="656" y="480" class="note">ni Cita ni CitaDAO comprueban si un</text>
  <text x="656" y="498" class="note">barbero ya tiene otra cita en la misma</text>
  <text x="656" y="516" class="note">fecha/hora antes de insertar o actualizar.</text>
  <text x="656" y="534" class="note">No existe una clase validadora de horario.</text>
</svg>
