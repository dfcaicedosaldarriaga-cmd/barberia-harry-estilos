<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de componentes en 4 capas: entrada (navegador y Postman), controladores (servlets JSP y controladores REST), capa compartida de negocio y datos (los mismos DAO), y persistencia (MySQL). El navegador nunca llama directamente a la API REST: cada canal llama a sus propios controladores, y ambos controladores llaman a los mismos DAO.">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: currentColor; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.6; }
    .layer { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 3 3; }
    .title { font-size: 16px; font-weight: 700; }
    .layerlbl { font-size: 12px; font-weight: 700; }
    .cname { font-size: 13px; font-weight: 700; }
    .sub { font-size: 10.5px; }
    .lbl { font-size: 11px; }
    .conn { stroke: currentColor; stroke-width: 1.5; fill: none; }
  </style>

  <text x="500" y="26" text-anchor="middle" class="title">Diagrama de componentes - dos canales, una capa de datos compartida</text>

  <!-- Layer 1: entrada -->
  <rect class="layer" x="30" y="50" width="940" height="90"/>
  <text x="45" y="68" class="layerlbl">Capa de entrada</text>
  <rect class="box" x="120" y="78" width="280" height="50"/>
  <text x="260" y="98" text-anchor="middle" class="cname">Navegador</text>
  <text x="260" y="116" text-anchor="middle" class="sub">formularios JSP, puerto 8080</text>
  <rect class="box" x="600" y="78" width="280" height="50"/>
  <text x="740" y="98" text-anchor="middle" class="cname">Postman / cliente HTTP</text>
  <text x="740" y="116" text-anchor="middle" class="sub">colecciones REST, puerto 8081</text>

  <!-- Layer 2: controladores -->
  <rect class="layer" x="30" y="160" width="940" height="110"/>
  <text x="45" y="178" class="layerlbl">Capa de controladores</text>
  <rect class="box" x="120" y="190" width="280" height="68"/>
  <text x="260" y="210" text-anchor="middle" class="cname">Servlets (WAR)</text>
  <text x="260" y="228" text-anchor="middle" class="sub">AgendamientoServlet, CitasServlet,</text>
  <text x="260" y="244" text-anchor="middle" class="sub">EliminarCitaServlet</text>
  <rect class="box" x="600" y="190" width="280" height="68"/>
  <text x="740" y="210" text-anchor="middle" class="cname">Controladores REST (Spring Boot)</text>
  <text x="740" y="228" text-anchor="middle" class="sub">CitaController, BarberoController,</text>
  <text x="740" y="244" text-anchor="middle" class="sub">ServicioController</text>

  <!-- Layer 3: negocio/datos compartida -->
  <rect class="layer" x="30" y="300" width="940" height="130"/>
  <text x="45" y="318" class="layerlbl">Capa compartida de negocio y datos (clases copiadas, mismo comportamiento)</text>
  <rect class="box" x="300" y="336" width="400" height="76"/>
  <text x="500" y="358" text-anchor="middle" class="cname">CitaDAO, BarberoDAO, ServicioDAO, ClienteDAO</text>
  <text x="500" y="378" text-anchor="middle" class="sub">sin validacion de cruce de horario</text>
  <text x="500" y="396" text-anchor="middle" class="sub">(no existe en ningun canal)</text>

  <!-- Layer 4: persistencia -->
  <rect class="layer" x="30" y="460" width="940" height="90"/>
  <text x="45" y="478" class="layerlbl">Capa de persistencia</text>
  <rect class="box" x="350" y="488" width="300" height="50"/>
  <text x="500" y="508" text-anchor="middle" class="cname">MySQL - barberia_harry_estilos</text>
  <text x="500" y="526" text-anchor="middle" class="sub">tablas citas, barberos, servicios, clientes</text>

  <!-- arrows -->
  <line x1="260" y1="128" x2="260" y2="190" class="conn" marker-end="url(#arrow3)"/>
  <text x="270" y="152" class="lbl">HTTP (formulario)</text>
  <line x1="740" y1="128" x2="740" y2="190" class="conn" marker-end="url(#arrow3)"/>
  <text x="750" y="152" class="lbl">HTTP (JSON/urlencoded)</text>

  <line x1="260" y1="258" x2="420" y2="336" class="conn" marker-end="url(#arrow3)"/>
  <line x1="740" y1="258" x2="580" y2="336" class="conn" marker-end="url(#arrow3)"/>
  <text x="300" y="287" class="lbl">llama a</text>
  <text x="650" y="287" class="lbl">llama a</text>

  <line x1="500" y1="412" x2="500" y2="488" class="conn" marker-end="url(#arrow3)"/>
  <text x="508" y="447" class="lbl">JDBC</text>

  <!-- bottom note -->
  <rect x="30" y="580" width="940" height="90" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="46" y="602" class="sub" font-style="italic">Nota: el navegador nunca llama directamente a los controladores REST, ni Postman a los</text>
  <text x="46" y="620" class="sub" font-style="italic">servlets. Cada canal tiene su propia capa de entrada y de controladores; lo unico que</text>
  <text x="46" y="638" class="sub" font-style="italic">comparten, de forma literal (clases copiadas con nota de origen), es la capa de acceso a</text>
  <text x="46" y="656" class="sub" font-style="italic">datos y la base de datos. Por eso el comportamiento de los dos canales es identico.</text>
</svg>
